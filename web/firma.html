<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}*{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Nexsound Firma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --void: #07060b; --panel: #100e17; --ink: #ece8f4; --dim: #8a83a0; --uv: #8f6bff; --heat: #ff5a36; --acid: #c8ff3d; --line: rgba(236,232,244,.14);
  --f-disp: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--void); color: var(--ink); font-family: var(--f-mono); font-size: 13px; line-height: 1.6; overflow-x: hidden; }
main { max-width: 1100px; margin: 0 auto; padding: calc(44px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px)); }
.back { position: absolute; top: calc(12px + env(safe-area-inset-top,0px)); left: 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
.back:hover, .back:focus-visible { color: var(--ink); }
h1 { font: 900 clamp(48px, 13vw, 120px)/.85 var(--f-disp); text-transform: uppercase; margin: 0 0 12px; letter-spacing: -.01em; }
h1 span { color: var(--heat); }
h2 { font: 800 clamp(22px, 5vw, 32px)/1 var(--f-disp); text-transform: uppercase; margin: 28px 0 10px; letter-spacing: .02em; }
p.lead { color: var(--dim); max-width: 60ch; margin: 0 0 18px; }
button { font: 600 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; touch-action: manipulation; }
button:hover { border-color: var(--uv); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--uv); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.hot { border-color: var(--heat); color: var(--heat); }
button.hot:hover { background: var(--heat); color: var(--void); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--dim); }
label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
input[type=range] { accent-color: var(--heat); width: 160px; max-width: 100%; }
select, input[type=text], textarea { font: 400 13px var(--f-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 9px 10px; max-width: 100%; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<style>
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
#emb { width: 100%; aspect-ratio: 1; display: block; background: #0b0a11; border: 1px solid var(--line); cursor: pointer; }
#name { font: 800 24px var(--f-disp); letter-spacing: .04em; flex: 1; min-width: 0; text-transform: uppercase; }
.vars { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 400 12px/1.7 var(--f-mono); color: var(--ink); }
pre b { color: var(--acid); font-weight: 600; }
</style>
<a class="back" href="experiencias.html">← Experiencias</a>
<main>
  <h1>Firma <span>sonora</span></h1>
  <p class="lead">Escribe un nombre y obtén su logo sonoro de 3 segundos y su emblema. Es determinista: el mismo nombre siempre suena y se ve igual, porque todo sale de la misma huella.</p>
  <div class="row" style="margin-bottom:14px">
    <label for="name" style="position:absolute;left:-9999px">Nombre</label>
    <input type="text" id="name" value="Nexsound" maxlength="40" autocomplete="off">
    <button class="hot" id="play">▶ Reproducir</button>
  </div>
  <div class="wrap">
    <div><canvas id="emb" aria-label="Emblema generado del nombre"></canvas></div>
    <div style="display:grid;gap:12px">
      <div><label>Variante</label><div class="vars" role="group" aria-label="Variante" id="vars">
        <button data-v="base" aria-pressed="true">Base</button><button data-v="corta" aria-pressed="false">Corta</button><button data-v="larga" aria-pressed="false">Larga</button><button data-v="oscura" aria-pressed="false">Oscura</button><button data-v="brillante" aria-pressed="false">Brillante</button>
      </div></div>
      <div class="card"><label>Receta</label><pre id="rec"></pre></div>
    </div>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NOTES = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
  const SCALES = [['mayor', [0,2,4,7,9,11]], ['menor', [0,2,3,7,8,10]], ['lidio', [0,2,4,6,7,11]], ['dórico', [0,2,3,5,7,9]], ['pentatónica', [0,2,4,7,9]], ['frigio', [0,1,3,7,8]]];
  const TIMBRES = [['campana FM', 'sine', 3.5], ['cristal FM', 'sine', 7], ['metal FM', 'sine', 1.41], ['pulso', 'square', 0], ['sierra suave', 'sawtooth', 0], ['flauta', 'triangle', 0]];
  const hash = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const mulberry = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function recipe(name, variant) {
    const key = name.trim().toLowerCase() || 'nexsound';
    const h = hash(key), r = mulberry(h), ri = (a, b) => a + Math.floor(r() * (b - a + 1));
    const [scName, sc] = SCALES[ri(0, SCALES.length - 1)];
    const root = 57 + ri(0, 11), tim = TIMBRES[ri(0, TIMBRES.length - 1)];
    let n = ri(3, 5);
    const notes = Array.from({length: n}, (_, i) => root + sc[ri(0, sc.length - 1)] + 12 * (i === n - 1 ? 0 : ri(0, 1)));
    const gaps = Array.from({length: n}, () => [.12, .18, .25, .33][ri(0, 3)]);
    let rev = .3 + r() * .6, revT = 1.2 + r() * 2.2, bright = .3 + r() * .6, chord = r() < .6, len = 3, pitch = 0, gapK = 1;
    const sym = ri(3, 9), hue = Math.round(r() * 360), shapeSeed = h;
    if (variant === 'corta') { len = 1.5; gapK = .55; revT *= .5; }
    if (variant === 'larga') { len = 5; gapK = 1.6; revT *= 1.5; rev = Math.min(1, rev + .2); }
    if (variant === 'oscura') { pitch = -12; bright *= .35; }
    if (variant === 'brillante') { pitch = 12; bright = Math.min(1, bright + .4); }
    return { key, h, scName, root, tim, notes: notes.map(m => m + pitch), gaps: gaps.map(g => g * gapK), rev, revT, bright, chord, len, sym, hue, shapeSeed, variant };
  }

  async function render(R) {
    const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(sr * R.len), sr);
    const r = mulberry(R.h ^ 0x9e37);
    const conv = ctx.createConvolver(), il = Math.ceil(sr * R.revT), ir = ctx.createBuffer(2, il, sr);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < il; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / il, 3); }
    conv.buffer = ir;
    const dry = ctx.createGain(), wet = ctx.createGain(); dry.gain.value = 1 - R.rev * .5; wet.gain.value = R.rev * .6;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600 + R.bright * 9000;
    const fade = ctx.createGain(); fade.gain.setValueAtTime(1, R.len - .3); fade.gain.linearRampToValueAtTime(0, R.len);
    lp.connect(dry).connect(fade); lp.connect(conv).connect(wet).connect(fade); fade.connect(ctx.destination);
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    let t = .03;
    const voice = (m, tt, dur, vel) => {
      const o = ctx.createOscillator(), v = ctx.createGain(); o.type = R.tim[1]; o.frequency.value = hz(m);
      if (R.tim[2]) { const mo = ctx.createOscillator(), mg = ctx.createGain(); mo.frequency.value = hz(m) * R.tim[2];
        mg.gain.setValueAtTime(hz(m) * 2.5 * R.bright, tt); mg.gain.exponentialRampToValueAtTime(1, tt + dur); mo.connect(mg).connect(o.frequency); mo.start(tt); mo.stop(tt + dur); }
      const amp = (R.tim[2] ? .28 : .14) * vel;
      v.gain.setValueAtTime(0, tt); v.gain.linearRampToValueAtTime(amp, tt + .008); v.gain.exponentialRampToValueAtTime(.0005, tt + dur);
      o.connect(v).connect(lp); o.start(tt); o.stop(tt + dur);
    };
    R.notes.forEach((m, i) => { const last = i === R.notes.length - 1, dur = last ? Math.max(.4, R.len - t - .2) : R.gaps[i] * 3;
      voice(m, t, dur, last ? 1 : .75);
      if (last && R.chord) { voice(m - 12, t, dur, .6); voice(m + 7, t + .02, dur, .45); }
      t += R.gaps[i]; });
    return ctx.startRendering();
  }

  function emblem(R, prog = 1) {
    const cv = $('emb'), b = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(b.width * dpr); cv.height = Math.round(b.height * dpr);
    const c = cv.getContext('2d'), W = cv.width, cx = W / 2, r = mulberry(R.shapeSeed);
    const hue2 = (R.hue + 140) % 360, L = R.variant === 'oscura' ? 40 : R.variant === 'brillante' ? 72 : 58;
    c.fillStyle = '#0b0a11'; c.fillRect(0, 0, W, W);
    const g = c.createRadialGradient(cx, cx, 0, cx, cx, W * .5); g.addColorStop(0, 'hsla(' + R.hue + ',90%,' + L + '%,' + (.15 + .25 * R.rev) + ')'); g.addColorStop(1, 'transparent');
    c.fillStyle = g; c.fillRect(0, 0, W, W);
    c.save(); c.translate(cx, cx);
    const layers = R.notes.length, sizeK = R.variant === 'corta' ? .8 : R.variant === 'larga' ? 1.08 : 1;
    for (let l = 0; l < layers; l++) {
      const rad = W * .4 * sizeK * (1 - l / (layers + 1)), pts = R.sym * (1 + (R.notes[l] % 3));
      const amp = .1 + r() * .35, ph = r() * Math.PI, show = Math.min(1, Math.max(0, prog * layers - l));
      if (show <= 0) continue;
      c.beginPath();
      for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, rr = rad * (1 - amp * .5 + amp * .5 * Math.cos(a * pts + ph)) * (.7 + .3 * show);
        i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.lineWidth = Math.max(1, W / 220) * (l === 0 ? 2 : 1);
      c.strokeStyle = 'hsla(' + (l % 2 ? hue2 : R.hue) + ',90%,' + L + '%,' + show + ')'; c.stroke();
    }
    for (let i = 0; i < R.sym; i++) { const a = i / R.sym * Math.PI * 2 - Math.PI / 2; c.fillStyle = 'hsl(' + hue2 + ',90%,' + L + '%)';
      c.beginPath(); c.arc(Math.cos(a) * W * .44 * sizeK, Math.sin(a) * W * .44 * sizeK, W / 90, 0, Math.PI * 2); c.fill(); }
    c.restore();
    c.fillStyle = '#ece8f4'; c.textAlign = 'center'; c.font = '900 ' + Math.round(W / 9) + 'px "Big Shoulders Display", Impact, sans-serif';
    c.fillText((R.key.split(/\s+/).length > 1 ? R.key.split(/\s+/).map(w => [...w][0] || '').join('') : R.key).slice(0, 2).toUpperCase(), cx, cx + W / 28);
  }

  function showRecipe(R) {
    const nm = (m) => NOTES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
    $('rec').innerHTML = 'huella   <b>' + R.h.toString(16).toUpperCase().padStart(8, '0') + '</b>\n' +
      'escala   <b>' + NOTES[R.root % 12] + ' ' + R.scName + '</b>\n' +
      'notas    <b>' + R.notes.map(nm).join(' · ') + '</b>' + (R.chord ? ' + acorde final' : '') + '\n' +
      'ritmo    <b>' + R.gaps.map(g => Math.round(g * 1000)).join(' / ') + ' ms</b>\n' +
      'timbre   <b>' + R.tim[0] + '</b>' + (R.tim[2] ? ' (ratio ' + R.tim[2] + ')' : '') + '\n' +
      'brillo   <b>' + Math.round(R.bright * 100) + '%</b>\n' +
      'reverb   <b>' + Math.round(R.rev * 100) + '% · ' + R.revT.toFixed(1) + ' s</b>\n' +
      'duración <b>' + R.len + ' s</b> · variante <b>' + R.variant + '</b>\n' +
      'emblema  <b>simetría ' + R.sym + ' · tono ' + R.hue + '°</b>';
  }

  let variant = 'base', cur = null, ac = null, src = null, anim = 0;
  function update() { cur = recipe($('name').value, variant); cur.buf = null; showRecipe(cur); emblem(cur); }
  async function play() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    const R = cur; if (!R.buf) R.buf = await render(R);
    if (src) try { src.stop(); } catch (e) {}
    src = ac.createBufferSource(); src.buffer = R.buf; src.connect(ac.destination); src.start();
    cancelAnimationFrame(anim);
    if (RM) { emblem(R); return; }
    const t0 = performance.now(), D = R.notes.reduce((a, g, i) => a + R.gaps[i], 0) * 1000 + 200;
    const step = (now) => { const p = Math.min(1, (now - t0) / D); emblem(R, p); if (p < 1 && cur === R) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  }
  $('name').addEventListener('input', update);
  $('name').addEventListener('keydown', e => { if (e.key === 'Enter') play(); });
  $('play').onclick = play; $('emb').onclick = play;
  $('vars').querySelectorAll('button').forEach(b => b.onclick = () => {
    variant = b.dataset.v; $('vars').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); update(); play(); });
  addEventListener('resize', () => cur && emblem(cur));
  update();
})();
</script>
