<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexsound Experiencias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one long type-led index; sections by family; each row is a link (works now) or a plain row (project). Single dark world. */
:root { --void: #07060b; --ink: #ece8f4; --dim: #8a83a0; --uv: #8f6bff; --heat: #ff5a36; --line: rgba(236,232,244,.14);
  --f-disp: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--void); color: var(--ink); font-family: var(--f-mono); }
main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 72px; display: grid; gap: 40px; }
h1 { font: 900 clamp(56px, 14vw, 140px)/.85 var(--f-disp); margin: 0; text-transform: uppercase; }
h1 span { color: var(--heat); }
h2 { font: 900 clamp(26px, 5vw, 40px)/1 var(--f-disp); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .02em; }
.lede, .sec p { color: var(--dim); font-size: 13px; line-height: 1.7; max-width: 64ch; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: 600 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--void); }
.filters button:focus-visible, a:focus-visible { outline: 2px solid var(--uv); outline-offset: 2px; }
.count { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
li > a, li > div { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
li b { font: 800 clamp(22px, 4vw, 30px)/1.05 var(--f-disp); text-transform: uppercase; }
li span { color: var(--dim); font-size: 13px; line-height: 1.55; }
li em { font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
li a em { color: var(--heat); }
li div em { color: var(--dim); }
li a:hover b { color: var(--uv); }
@media (max-width: 640px) { li > a, li > div { grid-template-columns: minmax(0, 1fr); } }
</style>
<main>
  <header style="display:grid;gap:18px">
    <h1>Experien<br><span>cias</span></h1>
    <p class="lede">Todas las ideas de Nexsound en un sitio. Las marcadas «Abrir» funcionan ya en tu navegador, con el sonido sintetizado en directo. Las marcadas «Proyecto» necesitan servidor, cuentas, pagos, sensores o trabajo presencial; aquí está lo que serían.</p>
    <div class="filters" id="f" role="group" aria-label="Filtrar">
      <button data-f="all" aria-pressed="true">Todas</button><button data-f="live" aria-pressed="false">Funcionan ya</button><button data-f="plan" aria-pressed="false">Proyectos</button>
    </div>
    <div class="count" id="count"></div>
  </header>
  <div id="list" style="display:grid;gap:40px"></div>
</main>

  [null,'Música para fitness','Mezclas a tempo exacto para spinning, HIIT y yoga.'],

  [null,'Vinilos y merch que suena','Ediciones de 100 copias y camisetas con QR.'],
 ]],
];
let mode = 'all';
function render() {
  let live = 0, all = 0;
  document.getElementById('list').innerHTML = S.map(([t, d, items]) => {
    const rows = items.filter((i) => mode === 'all' || (mode === 'live') === !!i[0]);
    items.forEach((i) => { all++; if (i[0]) live++; });
    if (!rows.length) return '';
    return `<section class="sec"><h2>${t}</h2><p>${d}</p><ul>${rows.map(([h, n, s]) => h
      ? `<li><a href="${h}.html"><b>${n}</b><span>${s}</span><em>Abrir →</em></a></li>`
      : `<li><div><b>${n}</b><span>${s}</span><em>Proyecto</em></div></li>`).join('')}</ul></section>`;
  }).join('');
  document.getElementById('count').textContent = `${live} funcionan ya · ${all - live} proyectos · ${all} ideas`;
}
document.getElementById('f').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.f; [...b.parentNode.children].forEach((x) => x.setAttribute('aria-pressed', x === b)); render(); });
render();
</script>
