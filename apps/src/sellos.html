<title>Nexsound Sellos</title>
<!--HEAD-->
<style>
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: 600 14px/1 var(--f-body); padding: 11px 14px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.hero { display: grid; gap: 16px; padding-block: 10px; }
.hero h1 { font-size: clamp(40px, 8vw, 84px); }
.feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.feat div { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: grid; gap: 6px; align-content: start; }
.feat b { font: 700 17px/1.2 var(--f-display); }
.feat span { color: var(--muted); font-size: 14px; }
.feat .soon { border-style: dashed; }
.steps-h { display: flex; gap: 8px; flex-wrap: wrap; }
.steps-h span { font: 600 12px/1 var(--f-mono); padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.steps-h span.on { border-color: var(--accent); color: var(--accent); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .two { grid-template-columns: minmax(0, 1fr); } }
.badge { display: inline-flex; gap: 6px; align-items: center; font: 600 12px/1 var(--f-mono); color: var(--accent); border: 1px solid var(--accent); padding: 5px 8px; border-radius: 99px; }
.badge svg { width: 13px; height: 13px; }
.labelhead { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 16px; align-items: center; }
@media (max-width: 560px) { .labelhead { grid-template-columns: 64px minmax(0, 1fr); } .labelhead > :last-child { grid-column: 1 / -1; } }
.logo { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; background: var(--sunk); display: block; }
.status { font: 600 11px/1 var(--f-mono); padding: 4px 7px; border-radius: 3px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.st-ok { color: var(--good); } .st-wait { color: var(--warn); } .st-no { color: var(--danger); } .st-info { color: var(--accent); }
.qc { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; }
.qc li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.stars button { background: none; border: 0; cursor: pointer; font-size: 18px; color: var(--line); padding: 0 1px; }
.stars button.on { color: var(--signal); }
.pub { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.pub .cover { height: 160px; background: linear-gradient(135deg, var(--accent), var(--signal)); display: grid; place-items: end start; padding: 16px; color: #fff; }
.pub .cover h2 { color: #fff; font-size: 28px; letter-spacing: 0; text-transform: none; }
.pub .body { padding: 16px; display: grid; gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 4px; background: var(--surface); }
.card b { font-size: 15px; } .card span { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; word-break: break-all; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
</style>
<div class="wrap">
  <!--NAV-->
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  <main id="view"></main>
  <!--FOOT-->
</div>
<!--LIBS-->
<script>
(() => {
  const { $, esc } = NX; const KEY = 'nexsound-sellos-v1';
  const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0l2 2.2 3-.2.3 3L16 7l-1.6 2.3.6 3-3 .7L10.5 16 8 14.6 5.5 16 4 13l-3-.7.6-3L0 7l2.7-2 .3-3 3 .2z" fill="currentColor"/><path d="M5 8.3l2 2 4-4.3" stroke="#fff" stroke-width="1.6" fill="none"/></svg>';
  // ---------- estado (prototipo: se guarda en este navegador)
  const EXAMPLE = () => ({ example: true, label: { id: 'nexsound-records', name: 'Nexsound Records', style: 'Afro house · tech house · electrónica latina', country: 'España', founder: { name: 'Nexsound', doc: 'X1234567L', kind: 'persona' }, founded: new Date().toISOString(), logo: null, bio: 'Sello de electrónica latina para pistas que no paran.', split: 50, hash: '' },
    artists: [{ id: 1, name: 'Nexsound', email: 'hola@nexsound.es', role: 'Fundador', contract: 'artista', split: 50, status: 'firmado', signedAt: new Date().toISOString(), signName: 'Nexsound' }, { id: 2, name: 'Artista invitado (ejemplo)', email: 'artista@ejemplo.com', role: 'Artista', contract: 'licencia', split: 60, status: 'pendiente' }],
    demos: [{ id: 1, artist: 'Productora Ejemplo', email: 'demo@ejemplo.com', title: 'Noche Larga', style: 'Afro house', note: 'Me encanta el sonido del sello.', score: 4, status: 'nueva', at: new Date().toISOString() }],
    releases: [{ id: 1, title: 'Conéctate', artists: 'Nexsound', date: new Date(Date.now() + 28 * 864e5).toISOString().slice(0, 10), type: 'Single', isrc: '', upc: '', status: 'en preparación', qc: null, hash: '' }],
    products: [{ id: 1, title: 'Conéctate · WAV 24 bits', price: 1.99, kind: 'Tema' }, { id: 2, title: 'Pack de samples Nexsound Vol. 1', price: 14.99, kind: 'Samples' }, { id: 3, title: 'Club de fans (mensual)', price: 4.99, kind: 'Suscripción' }],
    team: [{ name: 'Nexsound', role: 'Fundador' }], income: [], contests: [] });
  let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!S) S = EXAMPLE();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { NX.toast('No se pudo guardar en este navegador.'); } };
  const today = () => new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  const fdate = (iso) => (iso ? new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
  const money = (v) => (+v || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  async function sha256(data) { const buf = typeof data === 'string' ? new TextEncoder().encode(data) : data; const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join(''); }
  // códigos: el ISRC y el UPC oficiales los asigna la agencia o la distribuidora; aquí se generan con su formato para el prototipo
  function isrc() { const y = String(new Date().getFullYear()).slice(2), n = String((S.releases.length * 7 + Date.now() % 1000) % 100000).padStart(5, '0'); return `ES-NX0-${y}-${n}`; }
  function upc() { const d = Array.from({ length: 11 }, (_, i) => (i === 0 ? 8 : Math.floor(Math.random() * 10))); const s = d.reduce((a, v, i) => a + v * (i % 2 ? 1 : 3), 0); return d.join('') + ((10 - (s % 10)) % 10); }
  // ---------- navegación
  const TABS = [['inicio', 'Inicio'], ['crear', 'Crear sello'], ['panel', 'Panel'], ['artistas', 'Artistas'], ['demos', 'Demos'], ['lanzamientos', 'Lanzamientos'], ['tienda', 'Tienda'], ['royalties', 'Royalties'], ['remix', 'Concursos'], ['publica', 'Página pública'], ['ideas', 'Más ideas']];
  let tab = (location.hash || '#inicio').slice(1); if (!TABS.some((t) => t[0] === tab)) tab = 'inicio';
  function nav() { $('tabs').innerHTML = TABS.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" data-t="${k}">${n}</button>`).join(''); }
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; go(b.dataset.t); });
  function go(t) { tab = t; try { history.replaceState(null, '', '#' + t); } catch (e) {} nav(); render(); window.scrollTo({ top: 0 }); }
  const V = {};
  function render() { $('view').innerHTML = V[tab](); (V[tab + '_'] || (() => {}))(); }
  const exampleNote = () => (S.example ? '<p class="small muted"><span class="tag">Ejemplo</span> Estás viendo un sello de ejemplo. Crea el tuyo en «Crear sello».</p>' : '');
  // ---------- INICIO
  V.inicio = () => `<section class="hero"><span class="brand"><b>Nexsound</b> · Sellos</span><h1>Tu sello, oficial, en 10 minutos.</h1>
    <p class="lede">Crea tu sello discográfico, quedas registrado como su fundador, ficha artistas con contrato firmado, recibe demos, lanza música con control de calidad, véndela en tu tienda y reparte los ingresos con liquidaciones claras. Todo desde nexsound.es.</p>
    <div class="row"><button class="btn primary" data-go="crear">Crear mi sello</button><button class="btn" data-go="panel">Ver un sello de ejemplo</button></div></section>
    <section class="col"><h2>Todo lo que tiene un sello profesional</h2><div class="feat">
      ${[['Fundación certificada', 'Certificado con fecha, fundador y huella digital (SHA-256) que demuestra quién creó el sello y cuándo.'], ['Fichajes con contrato', 'Licencia por tema, EP o contrato de artista, con reparto pactado y firma electrónica.'], ['Buzón de demos', 'Formulario público para recibir temas; el equipo los escucha, puntúa y responde.'], ['Control de calidad', 'Cada máster se revisa solo: volumen LUFS, pico real, formato y portada 3000 × 3000.'], ['Códigos y huella', 'ISRC por tema, UPC por lanzamiento y huella del máster como prueba de existencia.'], ['Tienda propia', 'Vende temas, packs de samples y suscripciones de fans.'], ['Royalties claros', 'Importa los informes de tu distribuidora y reparte automáticamente; liquidación en PDF por artista.'], ['Concursos de remix', 'Publica los stems, pon fecha límite y elige el mejor remix para lanzarlo en el sello.'], ['Página pública', 'Catálogo, artistas y tienda en nexsound.es/sello/tu-sello.']].map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join('')}
    </div></section>
    <section class="panel"><h2>Cómo funciona</h2><ol class="small" style="margin:0;padding-left:20px;display:grid;gap:6px"><li>Creas el sello y verificas tu identidad: quedas como fundador oficial.</li><li>Invitas a tus artistas; cada uno firma su contrato con el reparto pactado.</li><li>Subes cada lanzamiento: la web revisa la calidad y genera los códigos.</li><li>Se distribuye a las tiendas y se vende en tu tienda de Nexsound.</li><li>Cada mes, el dinero se reparte solo y cada artista recibe su liquidación.</li></ol>
    <p class="note">Prototipo: los pagos, la verificación de identidad y la distribución a tiendas se conectarán con proveedores oficiales (Stripe, firma electrónica y una distribuidora con conexión oficial a las tiendas). Los datos de esta demostración se guardan solo en tu navegador.</p></section>`;
  V.inicio_ = () => document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
  // ---------- CREAR SELLO (asistente)
  let step = 0, draft = { name: '', style: '', country: 'España', bio: '', fname: '', doc: '', kind: 'persona', logo: null, split: 50, terms: false };
  V.crear = () => {
    const st = ['Sello', 'Fundador', 'Imagen', 'Condiciones'].map((s, i) => `<span class="${i === step ? 'on' : ''}">${i + 1} · ${s}</span>`).join('');
    const body = [
      `<label class="field"><span>Nombre del sello</span><input type="text" id="d-name" value="${esc(draft.name)}" placeholder="Ej.: Luna Negra Records"></label><div id="namecheck" class="small"></div>
       <label class="field"><span>Estilo</span><input type="text" id="d-style" value="${esc(draft.style)}" placeholder="Ej.: reggaetón, house, techno"></label>
       <div class="two"><label class="field"><span>País</span><input type="text" id="d-country" value="${esc(draft.country)}"></label><label class="field"><span>Reparto por defecto para el artista</span><select id="d-split">${[50, 60, 70, 80].map((v) => `<option value="${v}" ${draft.split === v ? 'selected' : ''}>${v} % artista · ${100 - v} % sello</option>`).join('')}</select></label></div>
       <label class="field"><span>Descripción corta</span><textarea id="d-bio" rows="3">${esc(draft.bio)}</textarea></label>`,
      `<div class="two"><label class="field"><span>Nombre completo del fundador</span><input type="text" id="d-fname" value="${esc(draft.fname)}"></label><label class="field"><span>Titular</span><select id="d-kind"><option value="persona" ${draft.kind === 'persona' ? 'selected' : ''}>Persona (autónomo)</option><option value="empresa" ${draft.kind === 'empresa' ? 'selected' : ''}>Empresa</option></select></label></div>
       <label class="field"><span>${draft.kind === 'empresa' ? 'CIF' : 'DNI o NIE'}</span><input type="text" id="d-doc" value="${esc(draft.doc)}" placeholder="${draft.kind === 'empresa' ? 'B12345678' : '12345678Z'}"></label><div id="doccheck" class="small"></div>
       <p class="note">En la versión real, la identidad se confirma con foto del documento y un selfie a través de un proveedor de verificación. Aquí solo se comprueba que el formato del documento es válido.</p>`,
      `<label class="drop" id="d-drop" for="d-logo"><strong>Sube el logo</strong><small>PNG o JPG cuadrado. Si no, se genera uno con tus iniciales.</small></label><input type="file" id="d-logo" accept="image/*" hidden>
       <div class="row"><img class="logo" id="d-prev" alt="Logo del sello"><button class="btn small" id="d-gen">Generar con iniciales</button></div>`,
      `<div class="panel" style="background:var(--sunk)"><b>${esc(draft.name || 'Tu sello')}</b><span class="small muted">${esc(draft.style)} · ${esc(draft.country)} · fundado por ${esc(draft.fname)} (${esc(draft.doc)})</span></div>
       <label class="row small"><input type="checkbox" id="d-terms" ${draft.terms ? 'checked' : ''}> Declaro que soy el fundador de este sello, que los datos son reales y que tengo derecho a usar este nombre.</label>
       <p class="note">Al crear el sello se emite un certificado de fundación con la fecha y una huella digital (SHA-256) de todos estos datos. Proteger el nombre como marca se hace aparte, en la OEPM (España) o la EUIPO (Europa).</p>`][step];
    return `<section class="col"><header class="tool"><h1>Crear sello</h1><p class="lede">Cuatro pasos y tu sello queda creado con tu nombre como fundador.</p></header>
      <div class="panel"><div class="steps-h">${st}</div>${body}<div class="err" id="d-err" hidden></div>
      <div class="row">${step ? '<button class="btn" id="d-back">Atrás</button>' : ''}<button class="btn primary" id="d-next">${step === 3 ? 'Crear mi sello' : 'Siguiente'}</button></div></div></section>`;
  };
  function validDoc(v, kind) { v = v.toUpperCase().replace(/[\s-]/g, ''); const L = 'TRWAGMYFPDXBNJZSQVHLCKE'; if (kind === 'empresa') return /^[ABCDEFGHJNPQRSUVW]\d{7}[0-9A-J]$/.test(v); let m = v.match(/^(\d{8})([A-Z])$/); if (m) return L[+m[1] % 23] === m[2]; m = v.match(/^([XYZ])(\d{7})([A-Z])$/); if (m) return L[+(('XYZ'.indexOf(m[1])) + m[2]) % 23] === m[3]; return false; }
  function monogram(name) { const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, NX.css('--accent') || '#0F7A62'); g.addColorStop(1, '#101513'); x.fillStyle = g; x.fillRect(0, 0, 512, 512); const ini = (name || 'NX').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join(''); x.fillStyle = '#fff'; x.font = '800 220px Archivo, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ini, 256, 270); return c.toDataURL('image/png'); }
  V.crear_ = () => {
    const err = (m) => { $('d-err').textContent = m; $('d-err').hidden = !m; };
    const read = () => { [['d-name', 'name'], ['d-style', 'style'], ['d-country', 'country'], ['d-bio', 'bio'], ['d-fname', 'fname'], ['d-doc', 'doc']].forEach(([id, k]) => { if ($(id)) draft[k] = $(id).value.trim(); }); if ($('d-kind')) draft.kind = $('d-kind').value; if ($('d-split')) draft.split = +$('d-split').value; if ($('d-terms')) draft.terms = $('d-terms').checked; };
    if ($('d-name')) { const chk = () => { const v = $('d-name').value.trim(), slug = NX.cleanName(v).toLowerCase(); $('namecheck').innerHTML = !v ? '' : v.length < 3 ? '<span class="st-no">Mínimo 3 letras.</span>' : `<span class="st-ok">Disponible en Nexsound:</span> <span class="mono">nexsound.es/sello/${esc(slug)}</span>`; }; $('d-name').addEventListener('input', chk); chk(); }
    if ($('d-doc')) { const chk = () => { const ok = validDoc($('d-doc').value, $('d-kind').value); $('doccheck').innerHTML = $('d-doc').value ? (ok ? '<span class="st-ok">Formato válido.</span>' : '<span class="st-no">El documento no es válido: revisa la letra de control.</span>') : ''; }; $('d-doc').addEventListener('input', chk); $('d-kind').addEventListener('change', () => { read(); render(); }); chk(); }
    if ($('d-prev')) { if (!draft.logo) draft.logo = monogram(draft.name); $('d-prev').src = draft.logo; $('d-gen').addEventListener('click', () => { draft.logo = monogram(draft.name); $('d-prev').src = draft.logo; }); NX.dropzone($('d-drop'), $('d-logo'), (f) => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 512; const s = Math.max(512 / im.width, 512 / im.height); c.getContext('2d').drawImage(im, (512 - im.width * s) / 2, (512 - im.height * s) / 2, im.width * s, im.height * s); draft.logo = c.toDataURL('image/png'); $('d-prev').src = draft.logo; }; im.src = URL.createObjectURL(f[0]); }); }
    $('d-back') && $('d-back').addEventListener('click', () => { read(); step--; render(); });
    $('d-next').addEventListener('click', async () => {
      read();
      if (step === 0 && draft.name.length < 3) return err('Pon un nombre de al menos 3 letras.');
      if (step === 1 && (!draft.fname || !validDoc(draft.doc, draft.kind))) return err('Escribe tu nombre completo y un documento válido.');
      if (step === 3) {
        if (!draft.terms) return err('Tienes que aceptar la declaración para crear el sello.');
        const founded = new Date().toISOString(), id = NX.cleanName(draft.name).toLowerCase();
        const label = { id, name: draft.name, style: draft.style, country: draft.country, bio: draft.bio, founder: { name: draft.fname, doc: draft.doc.toUpperCase(), kind: draft.kind }, founded, logo: draft.logo, split: draft.split };
        label.hash = await sha256(JSON.stringify({ id, name: label.name, founder: label.founder, founded }));
        S = { example: false, label, artists: [{ id: 1, name: draft.fname, email: '', role: 'Fundador', contract: 'artista', split: draft.split, status: 'firmado', signedAt: founded, signName: draft.fname }], demos: [], releases: [], products: [], team: [{ name: draft.fname, role: 'Fundador' }], income: [], contests: [] };
        save(); step = 0; NX.toast('Sello creado: ' + label.name); go('panel'); return;
      }
      err(''); step++; render();
    });
  };
  // ---------- PANEL
  V.panel = () => {
    const L = S.label, rel = S.releases, art = S.artists, inc = S.income.reduce((s, r) => s + r.amount, 0);
    return `${exampleNote()}<section class="panel"><div class="labelhead"><img class="logo" src="${L.logo || monogram(L.name)}" alt="Logo de ${esc(L.name)}"><div><h1 style="font-size:clamp(28px,5vw,44px)">${esc(L.name)}</h1><div class="row small muted"><span class="badge">${CHECK} Sello verificado</span><span>Fundado por <b style="color:var(--ink)">${esc(L.founder.name)}</b> el ${fdate(L.founded)}</span></div></div><div class="row"><button class="btn" id="cert">Certificado de fundación</button></div></div>
      <p class="muted" style="margin:0">${esc(L.bio || '')}</p><div class="small muted">Huella del sello: <span class="mono">${esc(L.hash || 'se genera al crear el sello')}</span></div></section>
      <div class="facts"><div class="fact"><span>Artistas</span><b>${art.length}</b><small>${art.filter((a) => a.status === 'firmado').length} con contrato firmado</small></div><div class="fact"><span>Lanzamientos</span><b>${rel.length}</b><small>${rel.filter((r) => r.status === 'publicado').length} publicados</small></div><div class="fact"><span>Demos</span><b>${S.demos.length}</b><small>${S.demos.filter((d) => d.status === 'nueva').length} sin escuchar</small></div><div class="fact"><span>Ingresos</span><b>${money(inc)}</b><small>importados</small></div></div>
      <section class="panel"><h2>Siguientes pasos</h2><ul class="advice">${[
        [art.some((a) => a.status !== 'firmado'), 'warn', 'Hay contratos pendientes de firma.', 'artistas'], [S.demos.some((d) => d.status === 'nueva'), 'info', 'Tienes demos sin escuchar.', 'demos'], [rel.some((r) => !r.qc), 'warn', 'Hay lanzamientos sin máster revisado.', 'lanzamientos'], [!S.products.length, 'info', 'Tu tienda está vacía: añade tu primer producto.', 'tienda'], [true, 'good', 'Comparte tu buzón de demos para recibir música.', 'publica']].filter((x) => x[0]).map(([, l, t, g]) => `<li><span class="pill ${l}">${l === 'good' ? 'idea' : l === 'warn' ? 'pendiente' : 'nuevo'}</span><span>${t} <a href="#${g}" data-go="${g}">Ir</a></span></li>`).join('')}</ul></section>
      <section class="panel"><h2>Equipo</h2><div class="cards">${S.team.map((m) => `<div class="card"><b>${esc(m.name)}</b><span>${esc(m.role)}</span></div>`).join('')}</div>
      <div class="two"><label class="field"><span>Nombre</span><input type="text" id="tm-name"></label><label class="field"><span>Rol</span><select id="tm-role"><option>A&R (elige la música)</option><option>Gestión de lanzamientos</option><option>Diseño</option><option>Contabilidad</option><option>Prensa y redes</option></select></label></div><button class="btn small" id="tm-add">Añadir al equipo</button></section>
      <section class="panel"><h2>Datos</h2><div class="row"><button class="btn small" id="exp">Exportar todo (JSON)</button><label class="btn small" for="imp">Importar</label><input type="file" id="imp" accept=".json" hidden><button class="btn small" id="reset">Volver al ejemplo</button></div></section>`;
  };
  V.panel_ = () => {
    document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); go(b.dataset.go); }));

  function qcUI(r) {

    const owed = S.artists.map((a) => { let tot = 0; S.income.forEach((r) => { const rel = S.releases.find((x) => x.title === r.title); if (rel && rel.artists.split(/,|&| y | feat\.? /i).map((s) => s.trim().toLowerCase()).includes(a.name.toLowerCase())) tot += r.amount * a.split / 100; }); return { a, tot }; });
    return `${exampleNote()}<section class="panel"><h2>Importar ingresos</h2><p class="small muted">Sube el informe CSV de tu distribuidora (columnas con título, tienda, país e importe) o simula un mes para ver cómo funciona.</p><div class="row"><label class="btn" for="csvin">Importar CSV</label><input type="file" id="csvin" accept=".csv,text/csv" hidden><button class="btn" id="sim">Simular un mes</button><button class="btn small" id="clr">Borrar ingresos</button></div></section>
      <section class="panel"><h2>Por tema</h2>${Object.keys(per).length ? `<div class="tablewrap"><table class="data"><thead><tr><th>Tema</th><th class="num">Ingresos</th></tr></thead><tbody>${Object.entries(per).map(([t, v]) => `<tr><td>${esc(t)}</td><td class="num">${money(v)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Sin ingresos todavía.</p>'}</section>
      <section class="panel"><h2>Lo que corresponde a cada artista</h2><div class="tablewrap"><table class="data"><thead><tr><th>Artista</th><th class="num">Reparto</th><th class="num">Le corresponde</th><th></th></tr></thead><tbody>${owed.map(({ a, tot }) => `<tr><td>${esc(a.name)}</td><td class="num">${a.split} %</td><td class="num"><b>${money(tot)}</b></td><td><button class="dl" data-liq="${a.id}">Liquidación PDF</button></td></tr>`).join('')}</tbody></table></div><p class="note">El reparto se aplica a los temas en los que figura cada artista. El resto queda para el sello.</p></section>`;
  };
  V.royalties_ = () => {
    $('sim').addEventListener('click', () => { const stores = [['Spotify', 0.0035], ['Apple Music', 0.007], ['YouTube', 0.0012], ['Amazon Music', 0.004], ['Deezer', 0.0035]], countries = ['España', 'México', 'Colombia', 'Argentina', 'EE. UU.']; const month = new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); for (const r of S.releases) for (const [st, rate] of stores) { const plays = Math.round(Math.random() * 40000); S.income.push({ title: r.title, store: st, country: countries[Math.floor(Math.random() * countries.length)], plays, amount: plays * rate, month }); } save(); render(); NX.toast('Mes simulado (datos inventados para la demostración).'); });
    $('clr').addEventListener('click', () => { S.income = []; save(); render(); });
    $('csvin').addEventListener('change', async (e) => { const txt = await e.target.files[0].text(), lines = txt.trim().split(/\r?\n/), sep = lines[0].includes(';') ? ';' : ',', head = lines[0].toLowerCase().split(sep).map((h) => h.replace(/"/g, '').trim()); const col = (re) => head.findIndex((h) => re.test(h)); const ti = col(/t[ií]tulo|title|track|release/), ai = col(/importe|amount|revenue|earning|net|total/), si = col(/tienda|store|dsp|platform/), ci = col(/pa[ií]s|country|territory/); if (ti < 0 || ai < 0) return NX.toast('No encuentro las columnas de título e importe en ese CSV.'); let n = 0; for (const l of lines.slice(1)) { const c = l.split(sep).map((x) => x.replace(/"/g, '').trim()); const amt = parseFloat((c[ai] || '').replace(',', '.')); if (!isFinite(amt)) continue; S.income.push({ title: c[ti], store: si >= 0 ? c[si] : '', country: ci >= 0 ? c[ci] : '', amount: amt }); n++; } save(); render(); NX.toast(`${n} líneas importadas`); });
    document.querySelectorAll('[data-liq]').forEach((b) => b.addEventListener('click', () => { const a = S.artists.find((x) => x.id == b.dataset.liq), rows = S.income.filter((r) => { const rel = S.releases.find((x) => x.title === r.title); return rel && rel.artists.toLowerCase().includes(a.name.toLowerCase()); }); const tot = rows.reduce((s, r) => s + r.amount * a.split / 100, 0);
      NX.save(`liquidacion_${NX.cleanName(a.name)}.pdf`, NX.textPdf(['# LIQUIDACIÓN DE ROYALTIES', '', `Sello: ${S.label.name}`, `Artista: ${a.name}`, `Fecha: ${today()}`, `Reparto pactado: ${a.split} %`, '', '# Detalle', ...rows.map((r) => `${r.title.padEnd(26).slice(0, 26)} ${String(r.store || '').padEnd(14).slice(0, 14)} ${String(r.country || '').padEnd(10).slice(0, 10)} ${money(r.amount).padStart(12)}  ->  ${money(r.amount * a.split / 100)}`), '', `TOTAL A PAGAR: ${money(tot)}`, '', 'Pago en los 30 días siguientes a esta liquidación.'], 'Liquidación ' + a.name)); }));
  };
  // ---------- CONCURSOS DE REMIX
  V.remix = () => `${exampleNote()}<section class="panel"><h2>Concursos de remix</h2><p class="small muted">Publica los stems de un tema, pon fecha límite y deja que los productores compitan. El ganador sale en el sello.</p>
    ${S.contests.length ? S.contests.map((c, i) => `<div class="panel" style="background:var(--sunk)"><div class="row" style="justify-content:space-between"><b>${esc(c.title)}</b><span class="status ${new Date(c.end) > new Date() ? 'st-ok' : 'st-no'}">${new Date(c.end) > new Date() ? 'abierto' : 'cerrado'}</span></div><span class="small muted">Cierra el ${fdate(c.end + 'T12:00')} · premio: ${esc(c.prize)}</span>${c.entries.length ? `<ol class="small" style="margin:0;padding-left:18px">${c.entries.sort((x, y) => y.votes - x.votes).map((e) => `<li>${esc(e.who)} — «${esc(e.name)}» · ${e.votes} votos <button class="dl" data-vote="${i}|${esc(e.name)}">Votar</button></li>`).join('')}</ol>` : '<p class="empty">Aún no hay remixes.</p>'}<div class="two"><input type="text" placeholder="Tu nombre" id="ce-who-${i}" aria-label="Tu nombre"><input type="text" placeholder="Nombre del remix" id="ce-name-${i}" aria-label="Nombre del remix"></div><button class="btn small" data-enter="${i}">Enviar remix</button></div>`).join('') : '<p class="empty">No hay concursos abiertos.</p>'}
    <div class="two"><label class="field"><span>Tema</span><select id="c-rel">${S.releases.map((r) => `<option>${esc(r.title)}</option>`).join('')}</select></label><label class="field"><span>Fecha límite</span><input type="date" id="c-end"></label><label class="field"><span>Premio</span><input type="text" id="c-prize" value="Lanzamiento oficial en el sello + 50 % del remix"></label></div><button class="btn primary" id="c-add" ${S.releases.length ? '' : 'disabled'}>Abrir concurso</button>
    <p class="note">Los stems se sacan con Despiece o Sample Lab y se adjuntan al concurso.</p></section>`;
  V.remix_ = () => {
    $('c-add').addEventListener('click', () => { const end = $('c-end').value || new Date(Date.now() + 21 * 864e5).toISOString().slice(0, 10); S.contests.push({ title: 'Remix de ' + $('c-rel').value, end, prize: $('c-prize').value, entries: [] }); save(); render(); });
    document.querySelectorAll('[data-enter]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.enter, who = $('ce-who-' + i).value.trim(), nm = $('ce-name-' + i).value.trim(); if (!who || !nm) return; S.contests[i].entries.push({ who, name: nm, votes: 0 }); save(); render(); }));
    document.querySelectorAll('[data-vote]').forEach((b) => b.addEventListener('click', () => { const [i, nm] = b.dataset.vote.split('|'); const e = S.contests[+i].entries.find((x) => x.name === nm); if (e) e.votes++; save(); render(); }));
  };
  // ---------- PÁGINA PÚBLICA
  V.publica = () => { const L = S.label; return `<p class="small muted">Así ven tu sello los fans y los artistas en <span class="mono">nexsound.es/sello/${esc(L.id)}</span></p>
    <div class="pub"><div class="cover" style="background:linear-gradient(135deg, var(--accent), #101513)"><div class="row"><img class="logo" style="width:64px;height:64px" src="${L.logo || monogram(L.name)}" alt=""><div><h2>${esc(L.name)}</h2><span class="badge" style="color:#fff;border-color:#fff">${CHECK} Sello verificado · fundado por ${esc(L.founder.name)}</span></div></div></div>
    <div class="body"><p style="margin:0">${esc(L.bio || '')}</p><h2>Lanzamientos</h2><div class="cards">${S.releases.map((r) => `<div class="card"><b>${esc(r.title)}</b><span>${esc(r.artists)} · ${r.type}</span><span>${r.status === 'publicado' ? 'Ya disponible' : r.date ? 'Sale el ' + fdate(r.date + 'T12:00') : 'Próximamente'}</span></div>`).join('') || '<p class="empty">Pronto.</p>'}</div>
    <h2>Artistas</h2><div class="cards">${S.artists.filter((a) => a.status === 'firmado').map((a) => `<div class="card"><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div>`).join('')}</div>
    <h2>Tienda</h2><div class="cards">${S.products.map((p) => `<div class="card"><b>${esc(p.title)}</b><span>${money(p.price)}</span><button class="btn small" disabled title="Pagos en la versión real">Comprar</button></div>`).join('') || '<p class="empty">Pronto.</p>'}</div>
    <h2>Envía tu demo</h2>${demoForm()}</div></div>`; };
  V.publica_ = () => bindDemoForm();
  // ---------- MÁS IDEAS
  V.ideas = () => `<header class="tool"><h1>Lo que viene</h1><p class="lede">Ideas para que los sellos de Nexsound sean distintos de cualquier distribuidora. Las marcadas como «ya aquí» funcionan en esta versión.</p></header><div class="feat">
    ${[['ya aquí', 'Pasaporte del tema', 'Cada máster lleva su huella SHA-256 y la historia de cada paso (calidad, envío, cambios), en un PDF que cualquiera puede comprobar.'], ['ya aquí', 'Certificado de fundación', 'Prueba con fecha y huella de quién fundó el sello.'], ['ya aquí', 'Concursos de remix', 'Stems abiertos, votación y lanzamiento del ganador.'], ['ya aquí', 'Control de calidad automático', 'El sello no deja salir un máster saturado, bajo de volumen o sin portada correcta.'],
      ['próximo', 'Fichaje por los fans', 'Las demos más votadas por la comunidad pasan a la mesa del A&R.'], ['próximo', 'Royalties en tiempo real', 'Cada artista ve cada día lo que gana, no a los tres meses.'], ['próximo', 'Adelanto de royalties', 'El sello adelanta dinero al artista según lo que su tema ya está generando.'], ['próximo', 'Sello escuela', 'Productores con experiencia apadrinan a nuevos; el mentor recibe un porcentaje del primer lanzamiento.'],
      ['próximo', 'Coediciones entre sellos', 'Dos sellos lanzan juntos un tema y el reparto entre ambos se hace solo.'], ['próximo', 'Showcases del sello', 'Noches oficiales en salas, con venta de entradas en la página del sello y grabación con Set Cam.'], ['próximo', 'Vinilo bajo demanda', 'Cuando 100 fans reservan, se fabrica la tirada; si no se llega, no se cobra a nadie.'], ['próximo', 'Licencias para creadores', 'Streamers y youtubers licencian el catálogo del sello con un clic, y se reparte entre artistas.']].map(([s, a, b]) => `<div class="${s === 'próximo' ? 'soon' : ''}"><span class="status ${s === 'ya aquí' ? 'st-ok' : 'st-info'}" style="justify-self:start">${s}</span><b>${a}</b><span>${b}</span></div>`).join('')}
  </div>`;
  addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some((x) => x[0] === t) && t !== tab) go(t); });
  nav(); render();
})();
</script>
